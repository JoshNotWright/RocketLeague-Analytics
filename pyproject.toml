[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketleague-analytics"
version = "0.2.0"
description = "Reproducible Rocket League match analytics with explicit missingness and experimental lineup models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
rlanalytics = "rlanalytics.cli:main"

[tool.setuptools.packages.find]
include = ["rlanalytics*", "rlreplay*"]
